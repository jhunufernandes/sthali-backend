[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools >= 61.0",
]

[project]
name = "sthali-backend"
version = "0.0.1"
authors = [
  { name = "Jhunu Fernandes", email = "jhunu.fernandes@gmail.com" },
]
description = "A FastAPI lib for keep your app safe"
readme = "README.md"
requires-python = ">= 3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  # "alembic",
  "sthali-db @ file:../sthali-db/",
  "sthali-auth @ file:../sthali-auth/",
  "sthali-crud @ file:../sthali-crud/",
  "sthali-core @ file:../sthali-core/",
  "uvicorn",
  "aiosqlite",
  "greenlet",

  # "jinja2",
  # "pwdlib[argon2]",
  # "pyjwt",
  # "python-multipart",
  # "tenacity",
]

[project.urls]
"Homepage" = "https://github.com/project-sthali/sthali-backend"
"Bug Tracker" = "https://github.com/project-sthali/sthali-backend/issues"
"Source" = "https://github.com/project-sthali/sthali-backend"
"Documentation" = "https://project-sthali.github.io/sthali-backend"
"Changelog" = "https://github.com/project-sthali/sthali-backend/releases"

[project.optional-dependencies]
dev = [
  "coverage[toml] >= 7.12.0",
  "ruff >= 0.14.6",
]
tests = [
  "coverage[toml] >= 7.12.0",
]
stage = [
  "build >= 1.3.0",
  "coverage[toml] >= 7.12.0",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
  "ALL",
]
ignore = [
  "ANN401",  # any-type
  "TID252",  # relative-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "COM812",  # missing-trailing-comma
  "D100",  # undocumented-public-module
  "D101",  # undocumented-public-class
  "D102",  # undocumented-public-method
  "D104",  # undocumented-public-package
  "D106",  # undocumented-public-nested-class
  "PIE804",  # unnecessary-dict-kwargs
  "PT009",  # pytest-unittest-assertion
  "PT027",  # pytest-unittest-raises-assertion
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.alembic]
script_location = "%(here)s/alembic"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = [
  ".",
]
sqlalchemy_url = "sqlite:///sthali_auth.db"
